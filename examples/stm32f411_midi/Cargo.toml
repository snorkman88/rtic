[workspace]

[package]
authors = ["<Milton Sosa <milton.eduardo.sosa@gmail.com>"]
edition = "2018"
readme = "README.md"
name = "stm32f411_midi"
version = "0.1.0"

[dependencies]
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.1"
rtic = {version = "2.1.1", features=["thumbv7-backend", "rtic-monotonics"]}
panic-halt = "1.0.0"
embedded-hal = "1.0.0"
defmt = "0.3.5"
defmt-rtt = { version = "0.4.0"}
rtic-sync = "1.0.2"
usb-device = { version = "0.3.2", features = ["control-buffer-256"]}
usbd-serial = "0.2.0"
usbd-midi = "0.3.0"
synopsys-usb-otg = { version = "0.4.0", features = [
    "cortex-m",
], optional = true }


[dependencies.stm32f4xx-hal]
version = "0.22.1"
features = ["stm32f411","usb_fs","otg-fs"] # replace the model of your microcontroller here

# this lets you use `cargo fix`!
[[bin]]
name = "stm32f411_midi"
test = false
bench = false

